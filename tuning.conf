# Thor Forever performance settings. Edit, save, then launch the game.
# Only the keys below are read; anything else is ignored.
# These values are the best tested setup (AYN Thor, 2026-10-03). Deleting
# this file falls back to the safe defaults: installed driver and DXVK,
# esync off, DXVK_TILER=auto.

# Frame-rate cap applied by DXVK. 0 = no cap.
# WoW has its own cap too: raise "Max Foreground FPS" in the game's
# graphics options, or it keeps limiting you.
FPS_CAP=60

# On-screen overlay. off, or a comma list of DXVK HUD items, e.g.
# fps,frametimes,compiler,gpuload
# "compiler" shows a message while shaders are being compiled: if it
# appears exactly when a stutter happens, the stutter is shader compiling.
HUD=fps,frametimes,compiler

# Debug logs. off is faster; on restores the original verbose logging.
LOGS=off

# DXVK graphics pipeline library. Keep it off: with DXVK 2.6.2 the game
# crashed right after login when it was on (tested 2026-09-30).
GPL=off

# Wine esync. on lowers CPU overhead, worth roughly 5-10 FPS in cities.
# Needs two things: Android must not kill Wine's child processes (see
# docs/TUNING.md), and DRIVER=test, because the installed driver makes WoW
# crash with esync. With DRIVER=installed the launcher keeps esync off.
ESYNC=on

# Vulkan driver. installed = the device-tested driver.
# test = the driver in Download/Thor-Forever/driver-test/libvulkan_freedreno.so
# (for example a build from this repo's "Build Turnip" workflow).
# test is the best tested setup (Mesa 26.2.3 from "Build Turnip", sha256
# 775295d2...). Without that file the launcher uses the installed driver.
DRIVER=test

# Keep compiled shaders between sessions, so the same stutter doesn't come
# back after every restart. Only works with a driver built with the cache on.
SHADER_CACHE=on

# DXVK (the DirectX 11 to Vulkan layer). installed = the device-tested 2.4.1.
# test = the DLLs in Download/Thor-Forever/dxvk-test/ (dxgi.dll and d3d11.dll,
# for example a build from this repo's "Build DXVK" workflow).
# test is the best tested setup (DXVK 2.6.2 from "Build DXVK"): smoother
# than 2.4.1. Without those files the launcher uses the installed DXVK.
DXVK=test

# DXVK 2.6 and newer switch on a mode for tile-based mobile GPUs such as the
# Adreno by themselves. auto = DXVK decides, on/off = force it.
# Older DXVK versions (like the installed 2.4.1) ignore this.
# With 2.6.2, off was smoother than 2.5.3 and faster than auto.
DXVK_TILER=off

# Measurement mode. on writes perf.csv next to the other logs: which threads
# use how much CPU and on which core, core clocks and GPU load, every 2 s.
# It only reads system statistics and costs very little. Leave off for play.
PROFILE=off

# Which CPU cores Wine and WoW may use. all = Android decides.
# big = skip the three small cores. prime3 = only the three fastest cores.
AFFINITY=all
